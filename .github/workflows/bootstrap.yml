name: bootstrap

on:
  push:
  pull_request:

# Read-only: this workflow only ever checks out and applies.
permissions:
  contents: read

jobs:
  apply:
    name: apply on a clean machine
    runs-on: ubuntu-latest
    # A bare container, not the runner image: GitHub runners ship Homebrew, and
    # this must exercise the machine-without-brew path that used to fail.
    container: debian:bookworm-slim
    steps:
      - name: Install prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl ca-certificates

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

      - name: Apply
        run: chezmoi init --source "$GITHUB_WORKSPACE" --apply --promptDefaults

      - name: Verify target state
        run: chezmoi verify

      - name: Apply is idempotent
        run: |
          chezmoi apply
          test -z "$(chezmoi status)"

  lint:
    name: shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq zsh

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install Pi test runtime
        run: |
          npm install --global \
            @earendil-works/pi-coding-agent@1.5.0 \
            @tintinweb/pi-tasks@0.9.1 \
            @tintinweb/pi-subagents@0.23.1 \
            typescript@6.0.3
          PI_PACKAGE_ROOT="$(npm root --global)"
          PI_RUNTIME="$PI_PACKAGE_ROOT/@earendil-works/pi-coding-agent"
          test -f "$PI_RUNTIME/dist/index.js"
          test -f "$PI_PACKAGE_ROOT/@tintinweb/pi-tasks/src/index.ts"
          test -f \
            "$PI_PACKAGE_ROOT/@tintinweb/pi-subagents/src/invocation-config.ts"
          test -f "$PI_RUNTIME/node_modules/jiti/lib/jiti.mjs"
          test -f "$PI_RUNTIME/node_modules/typebox/build/index.mjs"
          echo "PI_RUNTIME=$PI_RUNTIME" >> "$GITHUB_ENV"
          echo "PI_PACKAGE_ROOT=$PI_PACKAGE_ROOT" >> "$GITHUB_ENV"

      # A zsh syntax error would otherwise surface only at the next login.
      - name: Check
        run: |
          for file in scripts/*.sh; do
            bash -n "$file"
          done
          sh -n home/run_once_after_zz-machine-setup.sh
          for file in home/dot_zshrc home/dot_zshenv home/dot_zprofile \
            home/dot_config/zsh/*.zsh home/dot_config/zsh/os/*.zsh; do
            zsh -n "$file"
          done
          bash scripts/test-pi-session-audit.sh
          bash scripts/test-fast-task-dispatch.sh
          bash scripts/test-agent-prompt-guard.sh
          bash scripts/test-bash-timeout-guard.sh
          bash scripts/test-compaction-handoff.sh
          bash scripts/test-task-outcome-receipt.sh
          python3 scripts/test-pi-routing.py
          bash scripts/test-pi-quota-status.sh
